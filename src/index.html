<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AchiPaint</title>
<link rel="stylesheet" href="./ui/theme.css?v=1795070000">
<link rel="stylesheet" href="./ui/splash.css?v=1795070000">
</head>
<body>
<div class="app">
  <!-- 标题栏 -->
  <div class="titlebar">
    <span class="tb-brand">AchiPaint</span>
    <span class="tb-doc" id="docinfo">未命名</span>
    <span class="tb-dirty" id="tb-dirty" hidden title="有未保存的改动"></span>

    <!-- 网页端菜单（Electron 里用系统菜单栏，这里隐藏） -->
    <nav class="tb-menus" id="tb-menus"></nav>

    <span class="tb-fill"></span>

    <div class="tb-actions">
      <button class="icon-btn" id="btn-new" data-cmd="file:new" title="新建 (⌘N)">
        <svg viewBox="0 0 18 18"><path d="M4.5 2.5h6l3.5 3.5v9.5h-9.5z"/><path d="M10.5 2.5V6H14"/></svg>
      </button>
      <button class="icon-btn" id="btn-open" data-cmd="file:open" title="打开 (⌘O)">
        <svg viewBox="0 0 18 18"><path d="M2.5 5.5h5l1.5 2h6.5v7.5h-13z"/></svg>
      </button>
      <button class="icon-btn" id="btn-save" data-cmd="file:save" title="保存 (⌘S)">
        <svg viewBox="0 0 18 18"><path d="M9 2.5v8"/><path d="M5.8 7.4 9 10.6l3.2-3.2"/><path d="M3.5 13.5v2h11v-2"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button class="icon-btn" id="btn-undo" data-cmd="edit:undo" title="撤销 (⌘Z)">
        <svg viewBox="0 0 18 18"><path d="M7 5.5 3.5 9l3.5 3.5"/><path d="M3.5 9h6.5a4 4 0 0 1 0 8H8"/></svg>
      </button>
      <button class="icon-btn" id="btn-redo" data-cmd="edit:redo" title="重做 (⇧⌘Z)">
        <svg viewBox="0 0 18 18"><path d="M11 5.5 14.5 9 11 12.5"/><path d="M14.5 9H8a4 4 0 0 0 0 8h2"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button class="icon-btn" id="btn-export" data-cmd="file:export" title="导出 PNG (⇧⌘E)">
        <svg viewBox="0 0 18 18"><rect x="2.5" y="3.5" width="13" height="11" rx="1.2"/><circle cx="6.4" cy="7" r="1.1"/><path d="M2.5 12.4 6 9.6l2.4 2.1 2.2-1.6 4.9 3.4"/></svg>
      </button>
    </div>
  </div>

  <!-- 左：工具 -->
  <div class="toolcol">
    <button class="tbtn" data-tool="brush" title="画笔 (B)">
      <svg viewBox="0 0 18 18"><path d="M3.2 14.8 5.4 9.2 11.6 3l3.4 3.4-6.2 6.2z"/><path d="M9.6 5.1 12.9 8.4"/></svg>
    </button>
    <button class="tbtn" data-tool="eraser" title="橡皮 (E)">
      <svg viewBox="0 0 18 18"><path d="M2.8 11.4 8.4 5.8a1.4 1.4 0 0 1 2 0l2.4 2.4a1.4 1.4 0 0 1 0 2L9.6 13.4H5.4z"/><path d="M6.6 13.4 3 13.4"/></svg>
    </button>
    <button class="tbtn" data-tool="pick" title="吸色 (I)">
      <svg viewBox="0 0 18 18"><path d="M10.6 4.2 13.8 7.4 6.4 14.8 3 15 3.2 11.6z"/><path d="M9.2 5.6 12.4 8.8"/><path d="M12.2 2.6a1.6 1.6 0 0 1 2.2 2.2l-1 1-2.2-2.2z"/></svg>
    </button>
    <button class="tbtn" data-tool="move" title="移动图层 (V)">
      <svg viewBox="0 0 18 18"><path d="M9 2.2 9 15.8"/><path d="M2.2 9 15.8 9"/><path d="M6.8 4.4 9 2.2l2.2 2.2"/><path d="M6.8 13.6 9 15.8l2.2-2.2"/><path d="M4.4 6.8 2.2 9l2.2 2.2"/><path d="M13.6 6.8 15.8 9l-2.2 2.2"/></svg>
    </button>
    <button class="tbtn" data-tool="select" title="矩形框选 (M)">
      <svg viewBox="0 0 18 18"><rect x="2.6" y="3.6" width="12.8" height="10.8" rx="1" stroke-dasharray="2.4 1.8"/></svg>
    </button>
    <button class="tbtn" data-tool="hand" title="抓手 (空格 / H)">
      <svg viewBox="0 0 18 18"><path d="M6.4 9.6V4.4a1.1 1.1 0 0 1 2.2 0v4.2"/><path d="M8.6 8.6V3.6a1.1 1.1 0 0 1 2.2 0v5"/><path d="M10.8 8.8V5a1.1 1.1 0 0 1 2.2 0v5.4"/><path d="M6.4 9.6 5.2 8.2a1.1 1.1 0 0 0-1.7 1.4l2.4 3.2a4.2 4.2 0 0 0 3.4 1.7h1.5a3 3 0 0 0 3-3V10"/></svg>
    </button>
    <button class="tbtn" data-tool="zoom" title="缩放 (Z)">
      <svg viewBox="0 0 18 18"><circle cx="7.8" cy="7.8" r="4.6"/><path d="M11.2 11.2 15.4 15.4"/><path d="M5.8 7.8 9.8 7.8"/></svg>
    </button>
    <div style="flex:1"></div>
    <button class="tbtn" id="btn-mask" title="编辑图层蒙版（第一次点会新建）">
      <svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="6.2"/><path d="M9 2.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="colorstack" id="colorstack">
      <button class="csw csw-sec" id="sw-secondary" title="副色（X 交换）"></button>
      <button class="csw csw-main" id="sw-primary" title="主色"></button>
    </div>
    <button class="tbtn" id="btn-fit" title="适应窗口">
      <svg viewBox="0 0 18 18"><path d="M2.6 6.4V2.6h3.8"/><path d="M15.4 11.6v3.8h-3.8"/><path d="M11.6 2.6h3.8v3.8"/><path d="M6.4 15.4H2.6v-3.8"/></svg>
    </button>
  </div>

  <!-- 中：画布 -->
  <div class="stage" id="stage">
    <canvas id="view"></canvas>
  </div>

  <!-- 右：属性 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-grip" id="sidebar-grip" title="拖动改宽度"></div>
    <div class="panel">
      <h3>笔刷</h3>
      <div class="body">
        <div class="field"><label>预设</label><select id="b-preset"><option>载入中…</option></select></div>
        <div id="brush-sliders"></div>
      </div>
    </div>

    <div class="panel">
      <h3>颜色</h3>
      <div class="body">
        <div class="colorline">
          <input type="color" id="color" class="swatch" value="#e8eaf0">
          <input id="hex" class="hexinp" value="#e8eaf0">
        </div>
        <div id="color-picker"></div>
        <div id="swatches" class="swatches"></div>
      </div>
    </div>

    <div class="panel layers">
      <h3>图层
        <span class="lay-tools">
          <button class="btn icon" id="btn-add-group" title="新建组（选中的图层会包进去）">▣</button>
          <button class="btn icon" id="btn-add-layer" title="新建图层">＋</button>
        </span>
      </h3>
      <div class="body" id="layers"></div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <span id="st-pos">0, 0</span>
    <span class="sep"></span>
    <span id="st-zoom">100%</span>
    <span class="sep"></span>
    <span id="st-size">2480 × 3508</span>
    <span style="flex:1"></span>
    <span id="st-mem">撤销 0 MB</span>
  </div>
</div>

<!-- 启动浮层：浮在主界面上，选完尺寸就收起 -->
<div class="splash" id="splash" hidden>
  <div class="splash-panel" role="dialog" aria-label="新建画布">

    <header class="splash-head">
      <img class="splash-mark" src="./ui/icon.png" alt="">
      <div class="splash-id">
        <b>AchiPaint</b>
        <span>轻核心 · 边缘插件</span>
      </div>
      <span class="splash-ver">v0.1.0</span>
    </header>

    <!-- 一屏：预设 + 最近 -->
    <div class="splash-view" id="splash-view-list">
      <div class="splash-main">
        <section class="splash-col">
          <h3>新建画布</h3>
          <div class="splash-grid" id="splash-presets"></div>
          <button class="btn splash-custom-btn" id="splash-custom">自定义尺寸…</button>
        </section>

        <section class="splash-col splash-col-recent">
          <h3>最近</h3>
          <div class="splash-recent" id="splash-recent"></div>
          <button class="btn splash-open" id="splash-open">打开文件…</button>
        </section>
      </div>

      <footer class="splash-foot">
        <span class="splash-dim" id="splash-note"></span>
        <span class="splash-dim">Esc 用默认尺寸</span>
      </footer>
    </div>

    <!-- 二屏：详细设置 -->
    <div class="splash-view" id="splash-view-detail" hidden>
      <div class="dt-grid">
        <label for="dt-name">名称</label>
        <input id="dt-name" type="text" value="未命名" maxlength="60">

        <label for="dt-w">宽度</label>
        <div class="dt-row">
          <input id="dt-w" type="number" min="64" max="12000" step="1" value="2480">
          <span class="dt-x">×</span>
          <input id="dt-h" type="number" min="64" max="12000" step="1" value="3508" aria-label="高度">
          <span class="dt-unit">px</span>
        </div>

        <label for="dt-dpi">分辨率</label>
        <div class="dt-row">
          <input id="dt-dpi" type="number" min="1" max="1200" step="1" value="300">
          <span class="dt-unit">ppi</span>
          <div class="dt-orient" role="group" aria-label="方向">
            <button id="dt-portrait" class="on" title="竖版">▯</button>
            <button id="dt-landscape" title="横版">▭</button>
          </div>
        </div>

        <label for="dt-bg">背景</label>
        <div class="dt-row">
          <select id="dt-bg">
            <option value="white">白色</option>
            <option value="transparent">透明</option>
          </select>
        </div>
      </div>

      <div class="dt-info" id="dt-info"></div>

      <footer class="splash-foot">
        <button class="btn" id="dt-back">返回</button>
        <span class="splash-dim" id="dt-physical"></span>
        <button class="btn primary" id="dt-create">创建</button>
      </footer>
    </div>

  </div>
</div>

<script type="module" src="./main.js?v=1795070000"></script>

</body>
</html>
