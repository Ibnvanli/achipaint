<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AchiPaint</title>
<link rel="stylesheet" href="./ui/theme.css?v=1795050300">
<link rel="stylesheet" href="./ui/welcome.css?v=1795050300">
</head>
<body class="welcome">
<div class="w-wrap">

  <header class="w-head">
    <div class="w-mark">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M14 50 C22 34, 30 44, 38 28 S52 16, 52 16"
              fill="none" stroke="#dfa03c" stroke-width="7"
              stroke-linecap="round"/>
      </svg>
    </div>
    <div class="w-id">
      <h1>AchiPaint</h1>
      <p>轻核心 · 边缘插件</p>
    </div>
    <span class="w-ver" id="ver"></span>
  </header>

  <div class="w-cols">

    <section class="w-col">
      <h2>新建画布</h2>
      <div class="w-grid" id="presets"></div>

      <div class="w-custom">
        <label>自定义</label>
        <input id="cw" type="number" min="64" max="12000" step="1" value="2480">
        <span class="w-times">×</span>
        <input id="ch" type="number" min="64" max="12000" step="1" value="3508">
        <button class="btn primary" id="ccreate">创建</button>
      </div>
      <p class="w-hint" id="chint"></p>
    </section>

    <section class="w-col w-col-recent">
      <h2>最近</h2>
      <div class="w-empty">
        <p>还没有文件。</p>
        <p class="w-dim">
          保存/打开还没做 —— 在那之前，关掉窗口作品就没了。
        </p>
      </div>

      <div class="w-foot">
        <div class="w-kv"><span>引擎</span><b>hokusai · libmypaint 数学</b></div>
        <div class="w-kv"><span>渲染</span><b id="renderEngine">—</b></div>
        <div class="w-kv"><span>说明</span><b>MIT · 代码大部分由 AI 生成</b></div>
      </div>
    </section>

  </div>
</div>
<script type="module" src="./ui/welcome.js?v=1795050300"></script>
</body>
</html>
